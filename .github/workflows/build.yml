name: Build extension
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      existing_release:
        description: Reuse the exact private release bytes for registration (tag ref required)
        type: boolean
        default: false
      platform:
        description: Native worker platform (no GitHub-hosted fallback)
        type: choice
        default: windows-amd64
        options:
          - windows-amd64
          - windows-arm64
          - linux-amd64
          - linux-arm64
          - macosx-amd64
          - macosx-arm64
permissions:
  contents: write
  id-token: write
concurrency:
  group: extension-${{ github.ref }}-${{ inputs.platform || 'windows-amd64' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: [self-hosted, devline-extension, "${{ inputs.platform || 'windows-amd64' }}"]
    timeout-minutes: 90
    env:
      DEVLINE_IDE_MIRROR: ${{ vars.DEVLINE_IDE_MIRROR }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - name: Restore exact private release for metadata registration
        if: ${{ inputs.existing_release == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ci/external_release.py --restore
      - name: Validate declaration and build release candidate
        if: ${{ inputs.existing_release != true }}
        run: python ci/build.py --repository .
      - name: Upload candidate (not an approved marketplace release)
        uses: actions/upload-artifact@v4
        with:
          name: devline-bytecode-viewer-${{ inputs.platform || 'windows-amd64' }}-${{ github.sha }}
          path: release-output/*
          retention-days: 3
          if-no-files-found: error
      - name: Publish private GitHub Release with verified assets
        if: ${{ startsWith(github.ref, 'refs/tags/v') && inputs.existing_release != true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ci/release.py release-output
      - name: Publish binary-only immutable assets and register with external CI
        if: ${{ startsWith(github.ref, 'refs/tags/v') && (vars.DEVLINE_DELIVERY_MODE == 'stage' || vars.DEVLINE_DELIVERY_MODE == 'external') }}
        env:
          DEVLINE_DELIVERY_MODE: ${{ vars.DEVLINE_DELIVERY_MODE }}
          DEVLINE_STAGE_ORIGIN: ${{ vars.DEVLINE_STAGE_ORIGIN }}
          DEVLINE_STAGE_REPOSITORY_LINK_ID: ${{ vars.DEVLINE_STAGE_REPOSITORY_LINK_ID }}
          DEVLINE_EXTERNAL_ORIGIN: ${{ vars.DEVLINE_EXTERNAL_ORIGIN }}
          DEVLINE_EXTERNAL_REPOSITORY_LINK_ID: ${{ vars.DEVLINE_EXTERNAL_REPOSITORY_LINK_ID }}
        run: python ci/external_release.py
      - name: Submit versioned archive to the existing marketplace publisher
        if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.DEVLINE_MARKETPLACE_PUBLISH == 'true' && vars.DEVLINE_DELIVERY_MODE != 'stage' && vars.DEVLINE_DELIVERY_MODE != 'external' }}
        run: node ci/publish.mjs release-output/publication.json release-output/extension.dlextension
